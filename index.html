<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>何歌うDB</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="homeLink">何歌うDB</h1>
  <button id="memoButton" class="memo-button">📌 今日のカラオケメモ</button>
  <p id="count" class="count"></p>
</header>

<nav class="denmoku-tabs">
  <button id="tabArtists" class="denmoku-tile denmoku-tile-artist">
    <span class="denmoku-tile-label">歌手名</span>
    <span class="denmoku-tile-sub">ARTIST</span>
  </button>
  <button id="tabSongs" class="denmoku-tile denmoku-tile-song active">
    <span class="denmoku-tile-label">曲名</span>
    <span class="denmoku-tile-sub">SONG</span>
  </button>
</nav>

<nav class="quick-filters">
  <button id="qfMotivation" class="quick-tile quick-tile-motivation">
    <span class="quick-tile-label">モチベ高</span>
    <span class="quick-tile-sub">HOT</span>
  </button>
  <button id="qfMastered" class="quick-tile quick-tile-mastered">
    <span class="quick-tile-label">極める</span>
    <span class="quick-tile-sub">MASTER</span>
  </button>
  <button id="qfGenre" class="quick-tile quick-tile-genre">
    <span class="quick-tile-label">ジャンル</span>
    <span class="quick-tile-sub">GENRE</span>
  </button>
</nav>

<div id="genrePanel" class="genre-panel" hidden>
  <div id="tagFilters" class="tag-filters"></div>
  <div id="purposeFilters" class="tag-filters"></div>
</div>

<div class="search-bar">
  <input id="search" type="search" placeholder="曲名・アーティスト名で検索" autocomplete="off">
</div>

<div class="sort-bar">
  <label for="sortSelect" class="sort-label">並び替え</label>
  <select id="sortSelect" class="sort-select">
    <option value="updated-desc">更新日時 新しい順</option>
    <option value="updated-asc">更新日時 古い順</option>
    <option value="artist">アーティスト名順</option>
    <option value="title">曲名順</option>
    <option value="motivation">モチベ高い順</option>
    <option value="mastered">極める順</option>
  </select>
</div>

<main id="songList" class="song-list"></main>
<main id="artistList" class="artist-list" hidden></main>

<div id="memoOverlay" class="overlay" hidden>
  <div class="memo-panel">
    <div class="memo-panel-header">
      <span>📌 今日のカラオケメモ</span>
      <button id="memoClose" class="memo-close" aria-label="閉じる">✕</button>
    </div>
    <pre id="memoText" class="memo-text"></pre>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
